#-----------------------------------------------------------------------#
# OPeNDAP BES configuration for GeoTIFF VOL connector testing           #
#-----------------------------------------------------------------------#

BES.ServerAdministrator=test@test.org
BES.User=user_name
BES.Group=group_name
BES.LogName=./bes.log
BES.LogVerbose=no

BES.modules=dap,cmd,h5
BES.module.dap=/home/hyoklee/src/hyrax/build/lib/bes/libdap_module.so
BES.module.cmd=/home/hyoklee/src/hyrax/build/lib/bes/libdap_xml_module.so
BES.module.h5=/home/hyoklee/src/hyrax/bes/modules/hdf5_handler/.libs/libhdf5_module.so

BES.Catalog.catalog.RootDirectory=/home/hyoklee/src/hyrax/bes/modules/hdf5_handler/data
BES.Data.RootDirectory=/dev/null

BES.Catalog.catalog.TypeMatch=h5:.*\.(HDF5|h5|he5|H5)(\.bz2|\.gz|\.Z)?$;
BES.Catalog.catalog.TypeMatch+=h5:.*\.(tif|tiff|TIF|TIFF)$;

BES.Catalog.catalog.Include=;
BES.Catalog.catalog.Exclude=^\..*;

BES.FollowSymLinks=No
BES.RootDirectory=/tmp

BES.Container.Persistence=volatile
BES.Memory.GlobalArea.EmergencyPoolSize=1
BES.Memory.GlobalArea.MaximumHeapSize=20
BES.Memory.GlobalArea.Verbose=no
BES.Memory.GlobalArea.ControlHeap=no

BES.ProcessManagerMethod=multiple
BES.DefaultResponseMethod=POST

BES.UncompressCache.dir=/tmp
BES.UncompressCache.prefix=bes_cache
BES.UncompressCache.size=500

H5.EnableCF=false
H5.EnableCFDMR=false
H5.EnableGeoTIFF=true
H5.GeoTIFFVolPluginPath=/home/hyoklee/src/vol-geotiff/build/src
H5.MetaDataMemCacheEntries=0
